{% extends "base.html" %}
{% block title %}Login — Student Academic Analytics{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <h1>AcademiQ</h1>
            <p>Student Academic Performance Prediction System</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="login-form" autocomplete="off">
            <label>Student ID</label>
            <div class="input-group">
                <i class="fa-solid fa-id-card"></i>
                <input type="text" name="student_id" placeholder="e.g. STU001" required>
            </div>

            <label>Password</label>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <div class="demo-creds">
            <div class="demo-title"><i class="fa-solid fa-key"></i> Demo Credentials</div>
            <div class="demo-grid">
                <div><code>STU001</code> / <code>stu001</code></div>
                <div><code>STU002</code> / <code>stu002</code></div>
                <div><code>STU003</code> / <code>stu003</code></div>
                <div><code>STU004</code> / <code>stu004</code></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
